<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Recurso No Encontrado | Sistema de Control Escolar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">
  <div class="max-w-md w-full bg-white border border-slate-200 rounded-xl shadow-sm p-8 text-center space-y-6">
    <div class="w-14 h-14 bg-slate-100 border border-slate-200 text-slate-700 rounded-full flex items-center justify-center mx-auto">
      <svg class="w-7 h-7 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
    </div>
    <div class="space-y-2">
      <span class="inline-block px-2.5 py-0.5 text-xs font-semibold uppercase tracking-wider text-slate-600 bg-slate-100 rounded border border-slate-200">
        Error 404
      </span>
      <h1 class="text-xl font-bold text-slate-900">Página o Recurso No Encontrado</h1>
      <p class="text-xs text-slate-600 leading-relaxed">
        La dirección solicitada no existe o fue reubicada dentro del sistema. Verifique la ruta ingresada o regrese al panel principal.
      </p>
    </div>
    <div class="pt-2 border-t border-slate-100 flex items-center justify-center gap-3">
      <a href="/" class="px-4 py-2 text-xs font-semibold text-white bg-blue-900 hover:bg-blue-950 rounded-lg shadow-sm transition">
        Ir al Panel Principal
      </a>
      <a href="javascript:history.back()" class="px-4 py-2 text-xs font-semibold text-slate-700 bg-white border border-slate-300 hover:bg-slate-50 rounded-lg transition">
        Regresar
      </a>
    </div>
    <div class="text-[11px] text-slate-600 pt-2">
      Complejo Educativo Santa Sofía &bull; Gestión Institucional
    </div>
  </div>
</body>
</html>
