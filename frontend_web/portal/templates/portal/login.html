<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión • {{ institucion.nombre|default:"Complejo Educativo Santa Sofía" }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex items-center justify-center p-4 antialiased">

  <!-- Tarjeta de Inicio de Sesión Corporativa y Sobria -->
  <div class="w-full max-w-sm">

    <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-100 space-y-6">

      <!-- Escudo / Logotipo Institucional -->
      <div class="text-center space-y-3">
        <div class="flex justify-center">
          {% if institucion.logo %}
            <img src="{{ institucion.logo.url }}" alt="{{ institucion.nombre }}" class="h-20 w-auto max-w-[200px] object-contain">
          {% else %}
            <div class="w-16 h-16 rounded-xl bg-blue-900 flex items-center justify-center text-white font-bold text-lg shadow-sm">
              CS
            </div>
          {% endif %}
        </div>

        <div>
          <h2 class="text-base font-bold text-slate-900 tracking-tight leading-tight">
            {{ institucion.nombre|default:"Complejo Educativo Santa Sofía" }}
          </h2>
          <p class="text-xs text-slate-500 mt-1">
            Control Escolar &bull; Año Lectivo {{ institucion.anio_lectivo|default:"2026" }}
          </p>
        </div>
      </div>

      <!-- Mensajes Flash de Error / Alerta -->
      {% if messages %}
        <div class="space-y-2">
          {% for msg in messages %}
            <div class="p-3 rounded-lg text-xs font-semibold flex items-center justify-between {% if msg.tags == 'error' %}bg-rose-50 text-rose-700 border border-rose-200{% else %}bg-blue-50 text-blue-700 border border-blue-200{% endif %}">
              <span>{{ msg }}</span>
              <button onclick="this.parentElement.remove()" class="text-sm font-bold opacity-60 hover:opacity-100">✕</button>
            </div>
          {% endfor %}
        </div>
      {% endif %}

      <!-- Formulario de Acceso Directo -->
      <form method="POST" action="{% url 'login' %}" class="space-y-4">
        {% csrf_token %}

        <div class="space-y-1">
          <label class="block text-xs font-semibold text-slate-700">Usuario o Correo Institucional</label>
          <input type="text" name="username" required autofocus placeholder="director@santasofia.edu.sv" 
            class="w-full text-xs px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-blue-900/20 focus:border-blue-900 focus:outline-none transition">
        </div>

        <div class="space-y-1">
          <label class="block text-xs font-semibold text-slate-700">Contraseña</label>
          <input type="password" name="password" required placeholder="••••••••••••" 
            class="w-full text-xs px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-blue-900/20 focus:border-blue-900 focus:outline-none transition">
        </div>

        <button type="submit" 
          class="w-full py-2.5 bg-blue-900 hover:bg-blue-950 text-white font-semibold rounded-lg text-xs tracking-wider uppercase transition shadow-sm">
          Iniciar Sesión
        </button>
      </form>

    </div>

  </div>

</body>
</html>
